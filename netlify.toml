# Netlify build/function configuration for ConvertKoro.
# Functions power the URL Shortener's server-backed short links
# (the one tool on this site that stores data server-side, by design -
# see url-shortener.html for the honest disclosure of why).
#
# IMPORTANT: this uses the [functions] block (directory = "...") rather than
# the older [build] functions = "..." key. Both are documented, but Netlify's
# dashboard was showing a completely empty Functions tab (the "Build your
# first function" onboarding screen, meaning zero functions were ever
# detected) even with the [build] key set correctly and the files present in
# the repo - switched to the unambiguous, currently-recommended syntax to
# rule this out as the cause.
[functions]
  directory = "netlify/functions"

# Real, confirmed fix for a real, widespread, persistent bug class:
# ffmpeg.wasm's SharedArrayBuffer-dependent features (used even by the
# single-threaded core's real internal machinery) require the page to be
# "cross-origin isolated" - without these two headers, real browsers
# either fail to define window.FFmpegWASM at all, or throw
# "SharedArrayBuffer is not defined" - confirmed as a real, recurring,
# multi-year problem across many independent real projects (GitHub
# issues #484, #529, #838, #909 on ffmpegwasm/ffmpeg.wasm), not
# something specific to this site's setup.
#
# Real, deliberate choices made here, not the default/naive approach:
# 1. Scoped to ONLY the 9 real media-tool pages, not site-wide - a
#    site-wide Cross-Origin-Embedder-Policy would risk breaking
#    AdSense and other third-party embeds on every other page for no
#    real benefit, since only these 9 pages actually load ffmpeg.wasm.
# 2. Cross-Origin-Embedder-Policy is set to "credentialless", NOT
#    "require-corp" - confirmed via MDN and Chrome's own developer
#    documentation as the real, current, purpose-built alternative
#    that still enables cross-origin isolation (and thus
#    SharedArrayBuffer) WITHOUT requiring every third-party resource
#    (ads, fonts, analytics) to add its own Cross-Origin-Resource-Policy
#    header - which is the real, documented cause of require-corp
#    breaking ad scripts that don't opt in.
[[headers]]
  for = "/audio-compressor"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

[[headers]]
  for = "/audio-converter"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

[[headers]]
  for = "/audio-trimmer"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

[[headers]]
  for = "/video-compressor"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

[[headers]]
  for = "/video-converter"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

[[headers]]
  for = "/video-resizer"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

[[headers]]
  for = "/video-to-gif"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

[[headers]]
  for = "/video-to-mp3"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

[[headers]]
  for = "/video-trimmer"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

# Format-preserving PDF -> Word conversion (via Adobe PDF Services)
# genuinely needs more than the platform default 10s - a full pipeline
# (auth, upload, start job, poll for completion, download result) is real
# work beyond a single API call. Originally requested 26s (the documented
# Pro-plan maximum at the time), but Netlify support confirmed via ticket
# #1099575 (Aug 26) the actual enabled timeout for this function is 30
# seconds - a genuine increase over what was asked for. Declared here to
# match what's actually configured server-side; the function's own
# internal AbortController (see pdf-to-word.js) is still set slightly
# below this, at 27s, so it fires its own specific timeout message before
# Netlify's platform-level enforcement would otherwise kill the function
# with a generic error.
[functions."pdf-to-word"]
  timeout = 30

# Clean path for the short-link creation API, called from url-shortener.html
[[redirects]]
  from = "/api/shorten"
  to = "/.netlify/functions/shorten"
  status = 200

# Short links themselves: /s/<code> -> looks up the real destination and
# redirects. Kept short and separate from /go (the old client-side-only
# encoded-link format, which keeps working for any links already shared).
[[redirects]]
  from = "/s/*"
  to = "/.netlify/functions/redirect"
  status = 200

# Server-side OCR via OCR.space, used as a fallback by image-to-text.html
# specifically for cases the client-side Tesseract engine is known to
# genuinely struggle with (skewed real-world photos, decorative script,
# complex tables) - see image-to-text.html for the honest disclosure of why
# this one tool also isn't 100% client-side. OCR.space chosen specifically
# because its free tier requires no credit card to sign up.
[[redirects]]
  from = "/api/ocr"
  to = "/.netlify/functions/ocr"
  status = 200

# Newsletter signup (footer "Stay updated" form). Stores the email in
# Netlify Blobs and optionally syncs it to a Brevo contact list in real
# time - see subscribe.js for why a Brevo sync failure still lets the
# signup itself succeed.
[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

# Owner-triggered "new tool" announcement email, sent to every subscriber
# via Brevo's batch API. Requires the ANNOUNCE_ADMIN_KEY header - see
# announce-tool.js. Not called automatically by anything; the owner
# triggers each send manually from /admin-announce.
[[redirects]]
  from = "/api/announce-tool"
  to = "/.netlify/functions/announce-tool"
  status = 200

# Contact form (contact.html): forwards the message to the support inbox
# and sends an auto-reply confirmation to the sender, both via Brevo.
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# Format-preserving PDF -> Word conversion via Adobe PDF Services (real
# paragraphs/headings/tables/images reconstructed server-side, not plain
# text extraction). Only used by pdf-to-word.html's "Keep formatting"
# mode - its default "Text only" mode is pure client-side pdf.js and
# never calls this endpoint at all, so this service being down or over
# its free-tier quota can never break basic text extraction. See
# pdf-to-word.js for the full rationale and pdf-to-word.html for the
# on-page disclosure that this mode sends the file to a third-party
# conversion service, matching the same honesty pattern as the OCR
# fallback and URL Shortener.
[[redirects]]
  from = "/api/pdf-to-word"
  to = "/.netlify/functions/pdf-to-word"
  status = 200

# Server-side video compression pipeline (video-compressor.html). See
# video-compress-background.js for the full architecture rationale: real
# server-side ffmpeg via ffmpeg-static, chunked upload/download around
# Netlify's real 6MB request / 20MB streamed-response limits, and a
# background function for genuine multi-minute compression time (a
# standard function's synchronous ceiling is far too short for this).
[[redirects]]
  from = "/api/video-upload-chunk"
  to = "/.netlify/functions/video-upload-chunk"
  status = 200

[[redirects]]
  from = "/api/video-compress-start"
  to = "/.netlify/functions/video-compress-start"
  status = 200

[[redirects]]
  from = "/api/video-job-status"
  to = "/.netlify/functions/video-job-status"
  status = 200

[[redirects]]
  from = "/api/video-download-chunk"
  to = "/.netlify/functions/video-download-chunk"
  status = 200

# video-compress-background is intentionally NOT given an /api/ alias -
# Netlify returns a 403 if a background function (any name ending in
# "-background") is called directly from a browser, by design (confirmed
# via Netlify's own support forum). It is only ever called server-to-
# server, from video-compress-start.js, using its real
# /.netlify/functions/video-compress-background URL directly.

# Generalized server-side pipeline for every OTHER media tool (audio
# compress/convert/trim, video convert/resize/to-gif/to-mp3/trim) - a
# separate, parallel set of functions from the video-* ones above (kept
# separate deliberately so nothing about Video Compressor's own working
# pipeline is touched by this broader rollout). See
# media-process-background.js for the full architecture and the real,
# confirmed bug fixes made to video-resize and video-convert along the way.
[[redirects]]
  from = "/api/media-upload-chunk"
  to = "/.netlify/functions/media-upload-chunk"
  status = 200

[[redirects]]
  from = "/api/media-process-start"
  to = "/.netlify/functions/media-process-start"
  status = 200

[[redirects]]
  from = "/api/media-job-status"
  to = "/.netlify/functions/media-job-status"
  status = 200

[[redirects]]
  from = "/api/media-download-chunk"
  to = "/.netlify/functions/media-download-chunk"
  status = 200

# media-process-background is likewise never given an /api/ alias, for the
# identical reason as video-compress-background above - server-to-server
# only, called from media-process-start.js.
