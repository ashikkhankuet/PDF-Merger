# Netlify build/function configuration for ConvertKoro.
# Functions power the URL Shortener's server-backed short links
# (the one tool on this site that stores data server-side, by design -
# see url-shortener.html for the honest disclosure of why).
#
# IMPORTANT: this uses the [functions] block (directory = "...") rather than
# the older [build] functions = "..." key. Both are documented, but Netlify's
# dashboard was showing a completely empty Functions tab (the "Build your
# first function" onboarding screen, meaning zero functions were ever
# detected) even with the [build] key set correctly and the files present in
# the repo - switched to the unambiguous, currently-recommended syntax to
# rule this out as the cause.
[functions]
  directory = "netlify/functions"

# Format-preserving PDF -> Word conversion (via Adobe PDF Services)
# genuinely needs more than the platform default 10s - a full pipeline
# (auth, upload, start job, poll for completion, download result) is real
# work beyond a single API call. Originally requested 26s (the documented
# Pro-plan maximum at the time), but Netlify support confirmed via ticket
# #1099575 (Aug 26) the actual enabled timeout for this function is 30
# seconds - a genuine increase over what was asked for. Declared here to
# match what's actually configured server-side; the function's own
# internal AbortController (see pdf-to-word.js) is still set slightly
# below this, at 27s, so it fires its own specific timeout message before
# Netlify's platform-level enforcement would otherwise kill the function
# with a generic error.
[functions."pdf-to-word"]
  timeout = 30

# Clean path for the short-link creation API, called from url-shortener.html
[[redirects]]
  from = "/api/shorten"
  to = "/.netlify/functions/shorten"
  status = 200

# Short links themselves: /s/<code> -> looks up the real destination and
# redirects. Kept short and separate from /go (the old client-side-only
# encoded-link format, which keeps working for any links already shared).
[[redirects]]
  from = "/s/*"
  to = "/.netlify/functions/redirect"
  status = 200

# Server-side OCR via OCR.space, used as a fallback by image-to-text.html
# specifically for cases the client-side Tesseract engine is known to
# genuinely struggle with (skewed real-world photos, decorative script,
# complex tables) - see image-to-text.html for the honest disclosure of why
# this one tool also isn't 100% client-side. OCR.space chosen specifically
# because its free tier requires no credit card to sign up.
[[redirects]]
  from = "/api/ocr"
  to = "/.netlify/functions/ocr"
  status = 200

# Newsletter signup (footer "Stay updated" form). Stores the email in
# Netlify Blobs and optionally syncs it to a Brevo contact list in real
# time - see subscribe.js for why a Brevo sync failure still lets the
# signup itself succeed.
[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

# Owner-triggered "new tool" announcement email, sent to every subscriber
# via Brevo's batch API. Requires the ANNOUNCE_ADMIN_KEY header - see
# announce-tool.js. Not called automatically by anything; the owner
# triggers each send manually from /admin-announce.
[[redirects]]
  from = "/api/announce-tool"
  to = "/.netlify/functions/announce-tool"
  status = 200

# Contact form (contact.html): forwards the message to the support inbox
# and sends an auto-reply confirmation to the sender, both via Brevo.
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# Format-preserving PDF -> Word conversion via Adobe PDF Services (real
# paragraphs/headings/tables/images reconstructed server-side, not plain
# text extraction). Only used by pdf-to-word.html's "Keep formatting"
# mode - its default "Text only" mode is pure client-side pdf.js and
# never calls this endpoint at all, so this service being down or over
# its free-tier quota can never break basic text extraction. See
# pdf-to-word.js for the full rationale and pdf-to-word.html for the
# on-page disclosure that this mode sends the file to a third-party
# conversion service, matching the same honesty pattern as the OCR
# fallback and URL Shortener.
[[redirects]]
  from = "/api/pdf-to-word"
  to = "/.netlify/functions/pdf-to-word"
  status = 200

# Text translation via Google Cloud Translation API - used by Image to
# Text's "Translate" feature to translate OCR-extracted text into another
# language. A real, deliberate hard per-request character cap is enforced
# inside translate.js itself (not just here) to bound worst-case cost,
# since Google's free tier requires a real billing account on file.
[[redirects]]
  from = "/api/translate"
  to = "/.netlify/functions/translate"
  status = 200
